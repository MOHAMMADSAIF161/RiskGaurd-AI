<main><div class="container" id="app"><div class="loading">Loading transactions...</div></div></main>
<script>
const esc=v=>String(v??"--").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const money=v=>`INR ${Number(v||0).toLocaleString('en-IN',{minimumFractionDigits:2})}`;
const pct=v=>v===null||v===undefined||Number.isNaN(Number(v))?'--':`${(Number(v)*100).toFixed(2)}%`;
const date=v=>{if(!v)return'--';try{return new Date(v).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'});}catch{return v}};
const riskClass=v=>String(v||'unavailable').toLowerCase().replace(/\s+/g,'-');
const decisionClass=v=>String(v||'manual_review').toLowerCase();
let allTransactions=[];

async function api(url){
    const r=await fetch(url);
    if(!r.ok) throw new Error(`Request failed (${r.status})`);
    return r.json();
}

function renderList(){
    document.getElementById('app').innerHTML=`
    <div class="hero">
        <div>
            <h1>Transaction Investigation</h1>
            <p>Review every transaction and open a complete AI risk analysis for any payment.</p>
        </div>
        <button class="btn btn-primary" onclick="loadList()">Refresh</button>
    </div>

    <div class="card list-card">
        <div class="list-head">
            <h2>All Transactions</h2>
            <input id="search" class="search"
                   placeholder="Search ID, payment, email, contact...">
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Payment</th>
                        <th>Customer</th>
                        <th>Amount</th>
                        <th>Method</th>
                        <th>Risk</th>
                        <th>Score</th>
                        <th>Decision</th>
                    </tr>
                </thead>
                <tbody id="rows"></tbody>
            </table>
        </div>
    </div>`;

    document.getElementById('search')
        .addEventListener('input',filterList);

    filterList();
}

function filterList(){
    const q=(document.getElementById('search')?.value||'').toLowerCase();

    const list=allTransactions.filter(t =>
        (`${t.id} ${t.payment_id||''} ${t.email||''} ${t.contact||''}`)
        .toLowerCase()
        .includes(q)
    );

    const rows=document.getElementById('rows');

    if(!list.length){
        rows.innerHTML='<tr><td colspan="8" class="empty">No transactions found.</td></tr>';
        return;
    }

    rows.innerHTML=list.map(t=>`
        <tr onclick="openDetail(${Number(t.id)})">
            <td><span class="id">#${esc(t.id)}</span></td>
            <td>${esc(t.payment_id)}</td>
            <td>${esc(t.email||t.contact)}</td>
            <td class="amount">${money(t.amount)}</td>
            <td>${esc(t.method||'--').toUpperCase()}</td>
            <td>
                <span class="badge ${riskClass(t.risk_band)}">
                    ${esc(t.risk_band||'UNAVAILABLE')}
                </span>
            </td>
            <td><strong>${esc(pct(t.risk_score))}</strong></td>
            <td>
                <span class="badge ${decisionClass(t.action)}">
                    ${esc(t.action||'MANUAL_REVIEW')}
                </span>
            </td>
        </tr>
    `).join('');
}

async function loadList(){
    try{
        const response=await api('/api/transactions?limit=500');

        // API returns {transactions: [...], count: ..., limit: ...}
        allTransactions=Array.isArray(response.transactions)
            ? response.transactions
            : [];

        renderList();

    }catch(e){
        document.getElementById('app').innerHTML=
            `<div class="error">
                Unable to load transactions. ${esc(e.message)}
            </div>`;
    }
}

function openDetail(id){window.location.href=`/transaction-details?id=${encodeURIComponent(id)}`}

async function loadDetail(id){
 try{
  const t=await api(`/api/transactions/${encodeURIComponent(id)}`);
  renderDetail(t);
 }catch(e){document.getElementById('app').innerHTML=`<div class="error">Unable to load transaction #${esc(id)}. ${esc(e.message)}</div>`}
}

function factorHtml(f){
 if(!f)return'';
 const positive=Number(f.shap_value)>0;
 return `<div class="factor">
   <div>
     <div class="name">${esc(f.title||f.feature||'Feature')}</div>
     <div class="value">${esc(f.explanation||('Value: '+f.value))}</div>
   </div>
   <div class="impact ${positive?'Increased risk':'Reduced risk'}">
     ${positive?'Increased risk':'Reduced risk'}<br>
     ${Number(f.shap_value).toFixed(5)}
   </div>
 </div>`;
}

function renderShap(t){
 const explanations=Array.isArray(t.shap_explanations)?t.shap_explanations:[];
 const rag=t.rag_explanation||null;

 if(!explanations.length&&!rag){
   return '<div class="notice">Risk explanation is not available for this transaction. The transaction may have been processed before explainability data was generated.</div>';
 }

 let ragHtml='';

 if(rag){
   const riskFactors=Array.isArray(rag.risk_factors)?rag.risk_factors:[];
   const safeFactors=Array.isArray(rag.safe_factors)?rag.safe_factors:[];

   ragHtml=`
   <div class="rag-card">
     <div class="rag-label">AI Risk Explanation</div>
     <div class="rag-summary">${esc(rag.summary||'Explanation generated from transaction risk evidence.')}</div>

     ${riskFactors.length?`
     <h3 class="rag-section-title">What increased risk</h3>
     <div>${riskFactors.map(factorHtml).join('')}</div>`:''}

     ${safeFactors.length?`
     <h3 class="rag-section-title">What reduced risk</h3>
     <div>${safeFactors.map(factorHtml).join('')}</div>`:''}

     <div class="rag-grounding">
       <strong>Grounded explanation</strong><br>
       ${esc(rag.grounding||'Explanation is grounded in the transaction SHAP evidence.')}
     </div>
   </div>`;
 }

 return `
   ${ragHtml}

   <div class="shap-actions">
     <div class="shap-summary">
       Technical SHAP details show the individual model feature contributions.
     </div>
     <button class="btn btn-secondary" onclick="toggleShap()">
       Show Technical SHAP Details
     </button>
   </div>

   <div id="shapContent" class="shap-content">
     <h3 style="margin:20px 0 8px;font-size:15px">All SHAP Contributions</h3>
     ${explanations.length
       ? explanations.map(factorHtml).join('')
       : '<div class="muted">No SHAP contributions available.</div>'}
   </div>`;
}

function toggleShap(){
 const el=document.getElementById('shapContent');
 const b=document.querySelector('.shap-actions button');
 if(!el)return;
 el.classList.toggle('show');
 b.textContent=el.classList.contains('show')
   ?'Hide Technical SHAP Details'
   :'Show Technical SHAP Details';
}
function renderDetail(t){
 const risk=t.risk_band||'UNAVAILABLE';const decision=t.action||'MANUAL_REVIEW';const fraud=t.fraud_prediction===true?'FRAUD':t.fraud_prediction===false?'LEGITIMATE':'NOT AVAILABLE';
 document.getElementById('app').innerHTML=`
 <div class="detail-header"><div><h1>Transaction #${esc(t.id)}</h1><p>Complete transaction-level AI risk investigation</p><div class="statuses"><span class="badge ${riskClass(risk)}">${esc(risk)}</span><span class="badge ${decisionClass(decision)}">${esc(decision)}</span><span class="badge ${fraud==='FRAUD'?'critical':fraud==='LEGITIMATE'?'low':'unavailable'}">${fraud}</span></div></div><div class="actions"><button class="btn btn-secondary" onclick="window.location.href='/transaction-details'">Back to Transactions</button></div></div>
 <div class="customer-history-card" id="customerHistoryCard">
    <h3>Customer History</h3>
    <p class="customer-history-subtitle">
        Customer history used by the risk assessment pipeline.
    </p>

    <div class="history-status unavailable" id="historyStatus">
        Checking customer history...
    </div>

    <div class="history-grid">
        <div class="history-item">
            <span class="history-label">Customer Type</span>
            <span class="history-value" id="customerType">—</span>
        </div>

        <div class="history-item">
            <span class="history-label">Previous Transactions</span>
            <span class="history-value" id="previousTransactionCount">—</span>
        </div>

        <div class="history-item">
            <span class="history-label">History Available</span>
            <span class="history-value" id="historyAvailable">—</span>
        </div>
    </div>
</div>
 <div class="detail-grid">
 <div class="card section-card"><h2>Transaction Information</h2><div class="info-grid">${info('Transaction ID','#'+t.id)}${info('Payment ID',t.payment_id)}${info('Order ID',t.order_id)}${info('Amount',money(t.amount))}${info('Currency',t.currency)}${info('Status',t.status)}${info('Payment Method',(t.method||'--').toUpperCase())}${info('Captured',t.captured?'Yes':'No')}${info('Event Type',t.event_type)}${info('Transaction Time',date(t.created_at))}${info('Transaction DT',t.transaction_dt)}</div></div>
 <div class="card section-card"><h2>Customer Information</h2><div class="info-grid">${info('Email',t.email)}${info('Contact',t.contact)}${info('Customer Key',t.customer_key)}${info('Payment ID',t.payment_id)}</div></div>
 <div class="card section-card full"><h2>AI Risk Analysis</h2><div class="score-grid">${score('Model 2',pct(t.model2_score),'Fraud probability')}${score('Model 3',pct(t.model3_score),'Fraud probability')}${score('Combined Risk',pct(t.risk_score),'Fusion score')}${score('Decision',decision,'Final action')}</div></div>
 <div class="card section-card full"><h2>SHAP Explainability</h2>${renderShap(t)}</div>
 </div>`;
 updateCustomerHistory(t);
}
function info(k,v){return `<div class="info"><small>${esc(k)}</small><strong>${esc(v)}</strong></div>`}
function score(k,v,p){return `<div class="score"><small>${esc(k)}</small><strong>${esc(v)}</strong><p>${esc(p)}</p></div>`}

const params=new URLSearchParams(location.search);const id=params.get('id');const merchantOrderId=params.get('order_id');
async function loadMerchantOrder(orderId){
 try{

  document.getElementById('app').innerHTML=`<div class="detail-header"><div><h1>${esc(o.order_id)}</h1><p>Merchant order investigation and explainable return-risk assessment</p><div class="statuses"><span class="badge ${riskClass(o.return_priority)}">${esc(o.return_priority)}</span><span class="badge ${o.return_flagged?'high':'low'}">${o.return_flagged?'REVIEW REQUIRED':'NOT FLAGGED'}</span><span class="badge unavailable">${esc(o.payment_status||'PENDING')}</span></div></div><div class="actions"><button class="btn btn-secondary" onclick="window.location.href='/transactions'">Back to Orders</button></div></div>

<div style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#64748b;font-weight:700">
AI MERCHANT RECOMMENDATION
</div>
<div style="margin-top:8px;font-size:20px;font-weight:800">
${esc(actionLabel(o.merchant_action))}
</div>
<div style="margin-top:6px;color:#64748b;font-size:13px">
Automatically generated from expected return loss and the validated operating cutoff.
</div>
</div></div>
  <div class="card section-card full"><h2>Return Risk SHAP Explanation</h2>${renderReturnShap(shap)}</div></div>`;
 }catch(e){document.getElementById('app').innerHTML='<div class="error">'+esc(e.message)+'</div>'}
}
function renderReturnShap(s){if(!s.shap_available)return '<div class="notice">SHAP explanation is unavailable for this order.'+(s.shap_reason?' '+esc(s.shap_reason):'')+'</div>';const f=(x,positive)=>`<div class="factor"><div><div class="name">${esc(x.feature)}</div><div class="value">Value: ${esc(x.value)}</div></div><div class="impact ${positive?'risk-up':'risk-down'}">${positive?'Increased risk':'Reduced risk'}<br>${Number(x.shap_value).toFixed(5)}</div></div>`;return `<p class="shap-summary">The explanation groups one-hot categorical effects back to the original order features.</p>${s.risk_factors?.length?'<h3>What increased return risk</h3>'+s.risk_factors.map(x=>f(x,true)).join(''):''}${s.safe_factors?.length?'<h3 style="margin-top:18px">What reduced return risk</h3>'+s.safe_factors.map(x=>f(x,false)).join(''):''}`}
function actionLabel(v){return ({REVIEW_ORDER:'Review Order',MAKE_CONTACT:'Make Contact',SAFE:'Safe',PENDING:'Pending'})[v]||v||'Pending'}
async function merchantAction(orderId,action){const r=await fetch('/api/orders/'+encodeURIComponent(orderId)+'/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action})});if(r.ok)loadMerchantOrder(orderId);}
if(merchantOrderId)loadMerchantOrder(merchantOrderId);else if(id)loadDetail(id);else loadList();
function updateCustomerHistory(t) {
    const status = document.getElementById("historyStatus");
    const type = document.getElementById("customerType");
    const count = document.getElementById("previousTransactionCount");
    const available = document.getElementById("historyAvailable");

    if (!status) return;

    if (t.cold_start === true) {
        status.textContent = "New Customer / Cold Start";
        status.className = "history-status cold";
        type.textContent = "New Customer";
        count.textContent = "0";
        available.textContent = "No";
        return;
    }

    if (t.cold_start === false) {
        status.textContent = "Returning Customer";
        status.className = "history-status returning";
        type.textContent = "Returning Customer";
        count.textContent = t.previous_transaction_count ?? "0";
        available.textContent = t.history_available ? "Yes" : "No";
        return;
    }

    status.textContent = "History Unavailable";
    status.className = "history-status unavailable";
    type.textContent = "Unavailable";
    count.textContent = "—";
    available.textContent = "Unavailable";
}
