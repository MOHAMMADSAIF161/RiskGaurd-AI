    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {

            min-height: 100vh;
            background:
                radial-gradient(
                    circle at top left,
                    #EAE2D6,
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom right,
                    #EEEEEE,
                    transparent 35%
                ),
                #F7F2EB;

            padding: 30px;
        }

        .container {
            margin: 30px auto;
        }

        .container {

            width: 100%;
            max-width: 480px;

            background: rgba(255, 255, 255, 0.96);

            border: 1px solid #E2DDD4;

            border-radius: 20px;

            padding: 32px;

            box-shadow:
                0 20px 50px
                rgba(82, 77, 66, 0.10);
        }


        /* =========================
           HEADER
        ========================= */

        .header {

            text-align: center;

            margin-bottom: 30px;
        }

        .logo {

            font-size: 30px;

            font-weight: 800;

            color: #2F332B;
        }

        .logo span {

            color: #8B9A6E;
        }

        .tagline {

            margin-top: 7px;

            color: #6F736A;

            font-size: 14px;
        }

        .security-badge {

            display: inline-flex;

            align-items: center;

            gap: 7px;

            margin-top: 15px;

            padding: 7px 12px;

            border-radius: 999px;

            background: #EEF2E7;

            color: #8B9A6E;

            font-size: 12px;

            font-weight: 700;
        }


        /* =========================
           FORM
        ========================= */

        .form-group {

            margin-bottom: 18px;
        }

        label {

            display: block;

            margin-bottom: 7px;

            color: #4D5148;

            font-size: 14px;

            font-weight: 700;
        }

        input {

            width: 100%;

            padding: 13px 14px;

            border: 1px solid #D8D3CA;

            border-radius: 10px;

            background: white;

            color: #2F332B;

            font-size: 15px;

            transition: 0.2s;
        }

        input:focus {

            outline: none;

            border-color: #8B9A6E;

            box-shadow:
                0 0 0 3px
                rgba(139, 154, 110, 0.14);
        }


        /* =========================
           PAYMENT BUTTON
        ========================= */

        .pay-btn {

            width: 100%;

            border: none;

            border-radius: 11px;

            padding: 15px;

            margin-top: 5px;

            background: #8B9A6E;

            color: white;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.2s;
        }

        .pay-btn:hover {

            background: #74845A;

            transform: translateY(-1px);
        }

        .pay-btn:disabled {

            background: #A6A99F;

            cursor: not-allowed;

            transform: none;
        }


        /* =========================
           MESSAGE
        ========================= */

        #message {

            margin-top: 18px;

            padding: 12px;

            border-radius: 10px;

            text-align: center;

            font-size: 14px;

            display: none;
        }

        #message.info {

            display: block;

            background: #EEF2E7;

            color: #74845A;
        }

        #message.error {

            display: block;

            background: #F2DEDA;

            color: #8D4B45;
        }


        /* =========================
           FOOTER
        ========================= */

        .footer {

            text-align: center;

            margin-top: 22px;

            color: #A6A99F;

            font-size: 12px;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 520px) {

            body {

                padding: 15px;
            }

            .container {

                padding: 24px;
            }

        }

    </style>

<div class="logo">

        </div>

        <div class="security-badge">

        </div>

    </div>

         PAYMENT FORM
    ========================= -->

        <!-- CUSTOMER NAME -->

        <div class="form-group">

            <label for="name">
                Customer Name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your name"
                autocomplete="name"
                required
            >

        </div>

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="customer@example.com"
                autocomplete="email"
                required
            >

        </div>



        <!-- CONTACT -->

        <div class="form-group">

            <label for="contact">
                Contact Number
            </label>

            <input
                type="tel"
                id="contact"
                name="contact"
                placeholder="10 digit mobile number"
                autocomplete="tel"
                required
            >

        </div>



        <!-- AMOUNT -->

        <div class="form-group">

            <label for="amount">
                Amount (INR)
            </label>

            <input
                type="text"
                id="amount"
                name="amount"
                value="Loading..."
                readonly
                required
                style="
                    background:#EEEEEE;
                    cursor:not-allowed;
                    font-weight:700;
                "
            >

            <small
                id="amountNotice"
                style="
                    display:block;
                    margin-top:6px;
                    color:#6F736A;
                    font-size:12px;
                "
            >
                Loading amount from your order...
            </small>

        </div>



        <!--
            PAYMENT METHOD REMOVED

            Razorpay Checkout will provide:
            - UPI
            - Cards
            - Net Banking
            - Wallets
            - Other available methods
        -->


        <!-- PAY BUTTON -->

        <button
            type="submit"
            id="payButton"
            class="pay-btn"
        >

            Pay Securely

        </button>

    </form>

<button type="button" id="homeButton" class="home-button" onclick="window.location.href='/dashboard'">
    Go to Home
</button>



    <!-- =========================
         STATUS MESSAGE
    ========================= -->

    <div id="message"></div>



    <!-- =========================
         FOOTER
    ========================= -->

    <div class="footer">

        RiskGuard AI - Real-Time Fraud Risk Manager

    </div>


</div>



<script>


/* =========================================================
   ELEMENTS
========================================================= */

const form =
    document.getElementById(
        "paymentForm"
    );


const message =
    document.getElementById(
        "message"
    );


const payButton =
    document.getElementById(
        "payButton"
    );

const internalOrderId = new URLSearchParams(window.location.search).get("order_id") || sessionStorage.getItem("riskguard_order_id");

let orderAmount = null;

const amountInput =
    document.getElementById("amount");

const amountNotice =
    document.getElementById("amountNotice");


async function loadMerchantOrder() {

    if (!internalOrderId) {

        amountInput.value = "Order not found";

        amountNotice.textContent =
            "Please create an order first.";

        payButton.disabled = true;

        return;
    }

    try {

        const response = await fetch(
            "/api/orders/" +
            encodeURIComponent(internalOrderId)
        );

        if (!response.ok) {
            throw new Error("Order not found");
        }

        const order = await response.json();

        orderAmount = Number(order.total_amount);

        if (!Number.isFinite(orderAmount) || orderAmount <= 0) {
            throw new Error("Invalid order amount");
        }

        amountInput.value =
            "?" + orderAmount.toFixed(2);

        amountNotice.textContent =
            "Amount automatically loaded from Order " +
            order.order_id;

        payButton.disabled = false;

        console.log(
            "Merchant order loaded:",
            order
        );

    } catch (error) {

        console.error(
            "Order loading failed:",
            error
        );

        amountInput.value =
            "Unable to load";

        amountNotice.textContent =
            "Unable to load order amount.";

        payButton.disabled = true;
    }
}

loadMerchantOrder();

if (internalOrderId) {
    const notice = document.createElement("div");
    notice.style.cssText = "margin:0 auto 18px;max-width:480px;padding:12px 16px;background:#EEF2E7;border:1px solid #C9D3B8;border-radius:10px;color:#74845A;font-size:13px;font-weight:700";
    notice.textContent = "RiskGuard Order: " + internalOrderId + " — payment will be linked to this order.";
    document.body.insertBefore(notice, document.querySelector(".container"));
}



/* =========================================================
   SHOW MESSAGE
========================================================= */

function showMessage(
    text,
    type = "info"
) {

    message.innerText = text;

    message.className = type;

}



/* =========================================================
   CLEAR PAYMENT FORM
========================================================= */

function clearPaymentForm() {

    /*
     * Completely reset all customer fields.
     */

    form.reset();


    /*
     * Remove any previous message.
     */

    message.innerText = "";

    message.className = "";


    /*
     * Make sure button is ready.
     */

    payButton.disabled = false;

    payButton.innerText =
        "Pay Securely";


    /*
     * Focus on customer name
     * for the next transaction.
     */

    document
        .getElementById("name")
        .focus();

}



/* =========================================================
   WAIT FOR WEBHOOK TRANSACTION
========================================================= */

async function waitForTransaction(
    paymentId,
    attempts = 15
) {

    for (
        let attempt = 0;
        attempt < attempts;
        attempt++
    ) {

        try {

            const response =
                await fetch(
                    "/api/transactions?limit=100"
                );


            if (response.ok) {

                const data =
                    await response.json();


                const transactions =
                    data.transactions || [];


                const transaction =
                    transactions.find(
                        item =>
                            item.payment_id ===
                            paymentId
                    );


                if (transaction) {

                    return transaction;

                }

            }

        }
        catch (error) {

            console.error(
                "Transaction polling error:",
                error
            );

        }


        /*
         * Wait 2 seconds before
         * checking again.
         */

        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    2000
                )
        );

    }


    return null;

}



/* =========================================================
   PAYMENT FORM SUBMIT
========================================================= */

form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        /* ============================================
           GET CUSTOMER DETAILS
        ============================================ */

        const name =
            document
                .getElementById("name")
                .value
                .trim();


        const email =
            document
                .getElementById("email")
                .value
                .trim();


        const contact =
            document
                .getElementById("contact")
                .value
                .trim();


        const amount = orderAmount;



        /* ============================================
           VALIDATION
        ============================================ */

        if (
            !name ||
            !email ||
            !contact ||
            !amount ||
            amount <= 0
        ) {

            showMessage(
                "Please enter valid payment details.",
                "error"
            );

            return;

        }



        /* ============================================
           DISABLE BUTTON
        ============================================ */

        payButton.disabled = true;

        payButton.innerText =
            "Creating Secure Order...";


        showMessage(
            "Connecting to RiskGuard AI...",
            "info"
        );



        try {


            /* ========================================
               CREATE RAZORPAY ORDER
            ======================================== */

            const response =
                await fetch(
                    "/create-order",
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify({

                                internal_order_id: internalOrderId

                            })

                    }
                );



            /* ========================================
               CHECK RESPONSE
            ======================================== */

            if (!response.ok) {

                const errorText =
                    await response.text();


                console.error(
                    "Create order failed:",
                    errorText
                );


                throw new Error(
                    "Unable to create Razorpay order"
                );

            }



            /* ========================================
               GET ORDER
            ======================================== */

            const order =
                await response.json();


            console.log(
                "Razorpay order:",
                order
            );



            /* ========================================
               RAZORPAY CHECKOUT
            ======================================== */

            const options = {

                key:
                    order.key_id,

                amount:
                    order.amount,

                currency:
                    order.currency,

                name:
                    "RiskGuard AI",

                description:
                    "RiskGuard AI Test Payment",

                order_id:
                    order.id,


                /* ==================================
                   CUSTOMER INFORMATION
                ================================== */

                prefill: {

                    name:
                        name,

                    email:
                        email,

                    contact:
                        contact

                },


                theme: {

                    color:
                        "#8B9A6E"

                },


                /* ==================================
                   PAYMENT SUCCESS
                ================================== */

                handler:
                    async function(
                        paymentResponse
                    ) {

                        console.log(
                            "Razorpay payment response:",
                            paymentResponse
                        );


                        /*
                         * Do not show any payment
                         * success message.
                         */

                        payButton.innerText =
                            "Processing...";


                        /*
                         * Wait for Razorpay webhook
                         * to process the transaction.
                         */

                        await waitForTransaction(
                            paymentResponse
                                .razorpay_payment_id
                        );


                        /*
                         * Completely clear the form.
                         *
                         * No risk information.
                         * No SHAP.
                         * No success message.
                         */

                        clearPaymentForm();

                        sessionStorage.removeItem("riskguard_order_id");
                        window.location.href = "/transactions";

                    },


                /* ==================================
                   PAYMENT WINDOW CLOSED
                ================================== */

                modal: {

                    ondismiss:
                        function() {

                            showMessage(
                                "Payment window closed.",
                                "info"
                            );


                            payButton.disabled =
                                false;


                            payButton.innerText =
                                "Pay Securely";

                        }

                }

            };



            /* ========================================
               CREATE RAZORPAY INSTANCE
            ======================================== */

            const razorpay =
                new Razorpay(
                    options
                );



            /* ========================================
               PAYMENT FAILED
            ======================================== */

            razorpay.on(
                "payment.failed",
                function(response) {

                    console.error(
                        "Razorpay payment failed:",
                        response
                    );


                    showMessage(
                        "Payment failed. Please try again.",
                "error"
                    );


                    payButton.disabled =
                        false;


                    payButton.innerText =
                        "Pay Securely";

                }
            );



            /* ========================================
               OPEN RAZORPAY
            ======================================== */

            razorpay.open();


        }
        catch (error) {

            console.error(
                "RiskGuard payment error:",
                error
            );


            showMessage(
                "Payment failed. Please try again.",
                "error"
            );


            payButton.disabled =
                false;


            payButton.innerText =
                "Pay Securely";

        }

    }
);

</script>


</body>

</html>
